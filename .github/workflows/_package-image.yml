name: package-image

# Reusable: build one package, wrap its artifacts in a scratch image, push to
# ghcr.io/<owner>/armada-packages/<package>, and print the digest to pin in armada.
on:
  workflow_call:
    inputs:
      package:
        description: "Image name suffix under ghcr.io/<owner>/armada-packages/"
        required: true
        type: string
      cpu_profile:
        description: "Optional Armada CPU profile passed to package builds"
        required: false
        type: string
        default: default
      tag:
        description: "Optional explicit image tag"
        required: false
        type: string
        default: ""
      publish_latest:
        description: "Also update the package's latest tag"
        required: false
        type: boolean
        default: true
    outputs:
      digest:
        description: "The pushed image digest (pin this in armada's Containerfile)"
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64; free for public repos
    concurrency:
      group: ${{ inputs.package }}-${{ inputs.cpu_profile }}-${{ inputs.tag || 'latest' }}-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      id-token: write           # cosign keyless (Sigstore OIDC)
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/armada-packages/${{ inputs.package }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      ARMADA_CPU_PROFILE: ${{ inputs.cpu_profile }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR image reference
        run: |
          image="${IMAGE,,}"
          [[ "${image}" == ghcr.io/*/* ]]
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "Publishing ${image}"

      - name: Tooling
        run: |
          sudo apt-get update -y && sudo apt-get install -y podman buildah ccache
          mkdir -p "${CCACHE_DIR}"

      # Opt-in lives in each build.sh: only those that wire up ccache populate
      # this per-package dir.
      - name: ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # hash the pinned toolchain into the key so a bump can't serve stale objects
          key: ccache-${{ inputs.package }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}-${{ hashFiles(format('{0}/**', inputs.package)) }}
          restore-keys: |
            ccache-${{ inputs.package }}-${{ runner.arch }}-${{ hashFiles('toolchain.env') }}-

      - name: Build artifacts
        run: |
          echo "ARMADA_CPU_PROFILE=${ARMADA_CPU_PROFILE}"
          cd ${{ inputs.package }} && ./build.sh

      - name: Stage image context
        run: |
          bash scripts/stage.sh ${{ inputs.package }}
          case "${{ inputs.package }}" in
            fex|mesa|mangohud|gamescope)
              printf '%s\n' "${ARMADA_CPU_PROFILE}" > ctx/rpms/.armada-cpu-profile
              ;;
            kernel)
              printf '%s\n' "${ARMADA_CPU_PROFILE}" > ctx/kernel/.armada-cpu-profile
              ;;
            *)
              printf '%s\n' "${ARMADA_CPU_PROFILE}" > ctx/.armada-cpu-profile
              ;;
          esac
          echo "Staged for ${IMAGE}:" && find ctx -type f

      - name: Build + push
        id: push
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "${TAG}" ] || TAG="$(date -u +%Y%m%d)-${GITHUB_SHA::8}"
          buildah build -f oci/Containerfile -t "${IMAGE}:${TAG}" .
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io
          buildah push --digestfile /tmp/digest "${IMAGE}:${TAG}"
          if [[ "${{ inputs.publish_latest }}" == true ]]; then
            buildah tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
            buildah push "${IMAGE}:latest"
          fi
          DIGEST="$(cat /tmp/digest)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### \`${{ inputs.package }}\` published"
            echo "CPU profile: \`${ARMADA_CPU_PROFILE}\`"
            echo "Reference from Armada:"
            echo '```'
            echo "${IMAGE}:${TAG}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (cosign keyless)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
